# Release: push a tag vX.Y.Z (`npm run release` bumps the version, tags, pushes and creates the
# draft release) →
#   linux:   build the AppImage + .deb in Docker (packaging/linux/build.sh), install and drive them
#            in a clean Ubuntu 24.04 container (test.sh), let the AppImage update itself (test-update.sh)
#   windows: build the NSIS installer on Windows (packaging/windows/build.sh), install it silently and
#            drive the installed app (test.sh), let it update itself to a newer build (win_update.mjs)
#   publish: upload both platforms' files to the tag's release (scripts/release-upload.sh). The Mac
#            files come from the Mac itself (signed + notarized there: scripts/release-mac.sh); the
#            release stays a draft until all three platforms' update feeds are on it, then whichever
#            upload comes last publishes it. The in-app updater (Settings → Updates) reads
#            latest-linux.yml / latest.yml / latest-mac.yml from the latest published release.
# "Run workflow" by hand (workflow_dispatch) builds + tests only (all platforms, or just one): a dry
# run, no release.
# No secrets: nothing here is signed (Windows builds are unsigned; Mac signing never leaves the Mac).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Dry run for
        type: choice
        options: [all, linux, windows]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::tag $GITHUB_REF_NAME but package.json says $V"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3
      # exposes the Actions cache token so plain `docker buildx` can use --cache-to type=gha
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build AppImage + .deb
        timeout-minutes: 60
        env:
          MS_BUILDX_ARGS: --cache-from type=gha,scope=linux --cache-to type=gha,mode=max,scope=linux
        run: packaging/linux/build.sh

      - name: Test the packages in a clean Ubuntu 24.04
        timeout-minutes: 75
        run: packaging/linux/test.sh

      - name: Test a real self-update (AppImage → newer AppImage)
        timeout-minutes: 45
        env:
          MS_BUILDX_ARGS: --cache-from type=gha,scope=linux
        run: packaging/linux/test-update.sh

      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-out
          path: release/test-out
          retention-days: 7
          if-no-files-found: ignore

      # the publish job takes them from here; dry runs (and failed runs) keep them a few days, to
      # try or debug that exact build
      - name: Keep the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/MathStudio-x86_64.AppImage
            release/MathStudio-amd64.deb
            release/latest-linux.yml
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::tag $GITHUB_REF_NAME but package.json says $V"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build the installer
        timeout-minutes: 60
        run: packaging/windows/build.sh

      # LaTeX for the Tex/Equation checks (the Linux test image has TeX Live from apt): TinyTeX
      # (a small TeX Live, pinned + checksummed) + the packages of ManimGL's default preamble —
      # the engine drops any \usepackage that's still missing
      - name: Install LaTeX (TinyTeX)
        timeout-minutes: 20
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tinytex.exe" https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/TinyTeX-1-windows-v2026.10.exe
          echo "36c329c644683d981a668419d13c8804696e2816ae4d287ad755788fee231a31  $RUNNER_TEMP/tinytex.exe" | sha256sum -c -
          7z x -y -bso0 "$RUNNER_TEMP/tinytex.exe" -o"$RUNNER_TEMP"
          TT="$RUNNER_TEMP/TinyTeX/bin/windows"
          "$TT/tlmgr.bat" update --self   # the repository is newer than the frozen release's tlmgr
          # roughly what the Linux test image gets from apt (texlive-latex-extra + science), plus
          # the extras of ManimGL's preamble
          "$TT/tlmgr.bat" install collection-latexrecommended collection-fontsrecommended collection-mathscience \
            dvisvgm standalone preview doublestroke setspace tipa relsize jknapltx rsfs calligra wasy wasysym \
            ragged2e physics xkeyval currfile filehook
          cygpath -w "$TT" >> "$GITHUB_PATH"
          "$TT/latex.exe" --version | sed -n 1p; "$TT/dvisvgm.exe" --version

      - name: Install it and drive the installed app
        timeout-minutes: 60
        run: packaging/windows/test.sh

      # the same app as 99.0.0 (reuses build-res-win/), then the installed app updates itself to it
      - name: Test a real self-update (installed app → newer installer)
        timeout-minutes: 45
        run: |
          npx electron-builder --config packaging/windows/electron-builder.yml --win nsis --x64 --publish never \
            -c.extraMetadata.version=99.0.0 -c.directories.output=release-next >/dev/null
          ls -l release-next
          MS_APP="$(cygpath -w "$LOCALAPPDATA/Programs/MathStudio/MathStudio.exe")" MS_NEXT=release-next MS_CUR=release \
            MS_OUT=release/test-out node tests/win_update.mjs

      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-out
          path: release/test-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/MathStudio-Setup.exe
            release/MathStudio-Setup.exe.blockmap
            release/latest.yml
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: release
          merge-multiple: true
      - name: Upload to the release (publishes it if the Mac files are already there)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          scripts/release-upload.sh "$GITHUB_REF_NAME" \
            release/MathStudio-x86_64.AppImage release/MathStudio-amd64.deb release/latest-linux.yml \
            release/MathStudio-Setup.exe release/MathStudio-Setup.exe.blockmap release/latest.yml
