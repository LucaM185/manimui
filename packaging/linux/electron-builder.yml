# Linux x86_64 build (AppImage + .deb). Run via packaging/linux/build.sh, which builds everything
# inside an amd64 Docker container and stages the Python bundle in build-res/ first.
appId: app.manimui.ide
productName: ManimUI
copyright: ManimUI
# the .deb (fpm) refuses to build without a homepage: the download site (gh-pages branch)
extraMetadata:
  homepage: https://lucam185.github.io/manimui/
directories:
  output: release
  buildResources: packaging
files:
  - electron/**/*
  - dist/**/*
  - packaging/icon.png
  - package.json
# node_modules: electron-builder adds the production dependencies only (electron-updater + its
# deps); everything the renderer uses is bundled into dist/ by Vite and lives in devDependencies.
# never ship the developer's .env (API key): the app reads keys from Settings / ~/.config/ManimUI
extraResources:
  - from: build-res/engine
    to: engine
  - from: build-res/python
    to: python
  - from: build-res/models
    to: models
# Updates: GitHub Releases of package.json "repository" (owner/repo inferred). The CI uploads the
# files itself (.github/workflows/release.yml); this only makes electron-builder write latest-linux.yml.
# manimui = launcher script that adds --no-sandbox where Chromium's sandbox can't start
afterPack: packaging/linux/after-pack.cjs
publish:
  - provider: github
linux:
  target:
    - AppImage
    - deb
  executableName: manimui
  icon: packaging/icon.png
  category: Graphics
  maintainer: ManimUI
  vendor: ManimUI
  synopsis: Visual IDE for ManimGL animations
  description: >-
    ManimUI is a visual editor for ManimGL animations: drag mobjects onto a timeline,
    tune them without code, use an AI agent, and export videos or ManimGL code.
    Python, ManimGL and ffmpeg are bundled.
  desktop:
    StartupWMClass: ManimUI
# No version in the file names: the website's download button links to
# github.com/<owner>/<repo>/releases/latest/download/ManimUI-x86_64.AppImage, and an AppImage
# without a version in its name is replaced in place when it updates itself.
appImage:
  artifactName: ManimUI-x86_64.AppImage
deb:
  artifactName: ManimUI-amd64.deb
  compression: xz
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    # 24.04+ first: there `libasound2` is virtual and apt picks liboss4-salsa-asound2, an OSS shim
    # without the symbols Electron needs ("undefined symbol: snd_device_name_get_hint") → no start
    - libasound2t64 | libasound2
    - libgl1
    - libegl1
    - fontconfig
    - libpangocairo-1.0-0
  fpm:
    - --deb-suggests
    - texlive-latex-extra
    - --deb-suggests
    - dvisvgm
